name: Bruno API Test

on:
  push:
    branches: [main]
    paths: ["server/**"]
  pull_request:
    branches: [main]
    paths: ["server/**"]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Start Express.js server
        id: server
        env:
          NODE_ENV: development
          PORT: 5000
          MONGO_URI: ${{secrets.MONGO_URI}}
          JWT_SECRET: ${{secrets.JWT_SECRET}}
        working-directory: server
        run: |
          nohup npm run dev > server.log 2>&1 &

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/api/v1 > /dev/null; then
              echo "Server is up!"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start:"
          cat server/server.log
          exit 1

      - name: Run Bruno API Tests
        uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: server/api-tests/collections/x-clone-api
          command: "run --env-file ../../environments/Development.yml"
