name: Bruno API Test

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/bruno*.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**", ".github/workflows/bruno*.yml"]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongo://localhost:27017/bruno_test
      JWT_SECRET: ${{secrets.JWT_SECRET}}

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Start Express.js server
        working-directory: server
        run: nohup npm start > server.log 2>&1 &

      - name: Wait for server to be ready
        working-directory: server
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Bruno API Tests
        uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: server/api-tests/collections/x-clone-api
          command: run --env-file ../../environments/Development.yml

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/server.log