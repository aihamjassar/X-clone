info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "fullName": "John Doe",
        "username": "johndoe3",
        "email": "johndoe3@example.com",
        "password": "1234567"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
